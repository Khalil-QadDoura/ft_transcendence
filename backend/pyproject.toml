[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors and unused names, I: sorted imports, B: common bugs, UP: modern Python syntax.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The alembic/ folder has the same name as the alembic package; say which is which.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets DATABASE_URL before it imports the app.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
