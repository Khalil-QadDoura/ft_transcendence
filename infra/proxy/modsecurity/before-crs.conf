# ModSecurity exclusions loaded BEFORE the OWASP CRS rules (INF-11).
#
# Mounted read-only over the image's
# /opt/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf (docker-compose.yml), so
# it is read right after crs-setup.conf and before every CRS rule. Rules here run at request
# time and switch a CRS rule off for one request only (ctl:...), when the request matches.
#
# Each exclusion below:
# - matches one path (or one path pattern) and one method where it can, on REQUEST_FILENAME
#   after t:urlDecodeUni and t:normalizePath, so /api/../grafana/... or %2e%2e cannot reach
#   another path's exclusion;
# - names the rule ids it lifts, and the one field (ARGS:json.<field>) when it is one field;
# - says what traffic it covers, which rules matched (the evidence: `make waf-check` and
#   `make grafana-check` audit lines) and why lifting them there is safe.
# Never here: ctl:ruleEngine=Off, removing 942100 or 941100 (libinjection SQL and XSS) from
# any API field (one approved exception: password fields, the last section), or lifting any
# paranoia level 1 rule from free text. See docs/infra/waf.md.
# Ids 10010-10099 are ours (the CRS uses 900000-999999).

# --------------------------------------------------------------------------- Grafana
# Grafana is behind its own login (admin only); these requests carry PromQL and dashboard
# JSON, which look like SQL and shell to the CRS.

# 953100 (PHP information leakage, outbound) matches Grafana's own pages: GET /grafana/login
# was cut mid-response. Response rules only; every request rule still runs on /grafana/.
SecRule REQUEST_FILENAME "@beginsWith /grafana/" \
    "id:10010,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,\
    ctl:ruleRemoveById=953100"

# POST /grafana/api/ds/query: every dashboard panel sends its queries here (one entry of
# "queries" per panel target; our panels have one or two). PromQL such as
# sum by (handler) (rate(http_requests_total{job="api"}[5m])) matched 942100, 942120,
# 942150, 942200, 942300, 942330, 942410, 942430 (SQL), 932271 (shell) and 941340 (XSS) in
# queries[].expr; the legend template {{handler}} matched 941380 in queries[].legendFormat.
# Only those two fields lose only those rules: the rest of the body is still inspected.
# Safe: Grafana passes expr to Prometheus, a read-only query language with no SQL or shell.
SecRule REQUEST_FILENAME "@streq /grafana/api/ds/query" \
    "id:10011,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetById=932271;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=941340;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=942100;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=942120;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=942150;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=942200;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=942300;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=942330;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=942410;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=942430;ARGS:json.queries.array_0.expr,\
        ctl:ruleRemoveTargetById=941380;ARGS:json.queries.array_0.legendFormat,\
        ctl:ruleRemoveTargetById=932271;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=941340;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=942100;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=942120;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=942150;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=942200;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=942300;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=942330;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=942410;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=942430;ARGS:json.queries.array_1.expr,\
        ctl:ruleRemoveTargetById=941380;ARGS:json.queries.array_1.legendFormat"

# POST /grafana/api/snapshots: "Share > Snapshot" sends the whole dashboard (every panel's
# PromQL, description and legend), dozens of fields. Snapshots are off in Grafana, so
# Grafana refuses every one with its own 403 "Dashboard Snapshots are disabled"; without
# this the WAF answered first with its HTML 403, and Grafana's message never showed.
# Matched: 932231, 932235, 932236, 932271 (shell), 941340, 941380 (XSS), 942100, 942150,
# 942180, 942200, 942210, 942300, 942330, 942340, 942370, 942410, 942430, 942510 (SQL).
# Lifted for this path and method only. Safe: admin only, and Grafana stores nothing.
SecRule REQUEST_FILENAME "@streq /grafana/api/snapshots" \
    "id:10012,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveById=932231,ctl:ruleRemoveById=932235,ctl:ruleRemoveById=932236,\
        ctl:ruleRemoveById=932271,ctl:ruleRemoveById=941340,ctl:ruleRemoveById=941380,\
        ctl:ruleRemoveById=942100,ctl:ruleRemoveById=942150,ctl:ruleRemoveById=942180,\
        ctl:ruleRemoveById=942200,ctl:ruleRemoveById=942210,ctl:ruleRemoveById=942300,\
        ctl:ruleRemoveById=942330,ctl:ruleRemoveById=942340,ctl:ruleRemoveById=942370,\
        ctl:ruleRemoveById=942410,ctl:ruleRemoveById=942430,ctl:ruleRemoveById=942510"

# --------------------------------------------------------------------------- Referer
# 932206 (Unix command injection, paranoia level 2) reads only the Referer header. A browser
# sends the page's URL there, and the jobs page keeps its search in its URL, so
# GET /api/jobs/open with "Referer: https://localhost/jobs?keyword=backend+developer" got
# the WAF's 403 (the "?" then the "/" of the path). Lifted for the API and the WebSockets
# only: the app never reads the Referer (no backend code uses it), so nothing in it can
# reach a command or a query. Every other rule still reads the Referer, and the pages send
# only their origin since INF-11 (Referrer-Policy: strict-origin, default.conf.template).
SecRule REQUEST_FILENAME "@rx ^/(?:api/|ws(?:/|$))" \
    "id:10040,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,\
    ctl:ruleRemoveById=932206"

# --------------------------------------------------------------------------- app free text
# People write prose: "--" as a dash, links, apostrophes, Russian and Arabic. At paranoia
# level 2 some PL2 rules read that as attacks. Each block lifts only the PL2 rules that
# waf-check's corpus showed on that field, on that path and method. Every PL1 rule stays
# on every field, among them 942100 and 941100 (libinjection), so "' OR 1=1 --" or
# "<script>" in these fields is still blocked; the API stores text as text (SQL
# parameters, React escaping), which is the real defence.
#   942440 SQL comment sequence: "--" used as a dash
#   931130 remote file inclusion: any link to another site (https://example.com/...)
#   932200 RCE bypass technique: "/portfolio?" or "'m ... https:/" in a sentence
#   942120 SQL operator: Russian text (Мой сайт: ... и телефон)
#   942200 MySQL comment/space obfuscation: a sentence with a link, "?", "&" and "--"
#   932231 Unix command injection: a sentence with a link and "--"

# PATCH /api/users/me (profile page): bio and position are free text.
SecRule REQUEST_FILENAME "@streq /api/users/me" \
    "id:10020,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq PATCH" "t:none,\
        ctl:ruleRemoveTargetById=942440;ARGS:json.bio,\
        ctl:ruleRemoveTargetById=931130;ARGS:json.bio,\
        ctl:ruleRemoveTargetById=932200;ARGS:json.bio,\
        ctl:ruleRemoveTargetById=942120;ARGS:json.bio,\
        ctl:ruleRemoveTargetById=932231;ARGS:json.bio,\
        ctl:ruleRemoveTargetById=942440;ARGS:json.position"

# POST /api/companies (become an employer): the company description is free text.
SecRule REQUEST_FILENAME "@streq /api/companies" \
    "id:10021,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetById=942440;ARGS:json.description,\
        ctl:ruleRemoveTargetById=931130;ARGS:json.description,\
        ctl:ruleRemoveTargetById=932200;ARGS:json.description"

# POST /api/jobs (post a job): the job description is free text.
SecRule REQUEST_FILENAME "@streq /api/jobs" \
    "id:10022,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetById=942440;ARGS:json.description,\
        ctl:ruleRemoveTargetById=931130;ARGS:json.description,\
        ctl:ruleRemoveTargetById=932200;ARGS:json.description"

# POST /api/conversations/<id>/messages (send) and PATCH .../messages/<id> (edit): the
# message text.
SecRule REQUEST_FILENAME "@rx ^/api/conversations/[0-9]+/messages(?:/[0-9]+)?$" \
    "id:10023,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PATCH)$" "t:none,\
        ctl:ruleRemoveTargetById=942440;ARGS:json.content,\
        ctl:ruleRemoveTargetById=931130;ARGS:json.content,\
        ctl:ruleRemoveTargetById=932200;ARGS:json.content,\
        ctl:ruleRemoveTargetById=942120;ARGS:json.content,\
        ctl:ruleRemoveTargetById=942200;ARGS:json.content"

# GET /api/jobs/open (job search page): the keyword the user types.
SecRule REQUEST_FILENAME "@streq /api/jobs/open" \
    "id:10024,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq GET" "t:none,\
        ctl:ruleRemoveTargetById=942440;ARGS:keyword"

# --------------------------------------------------------------------------- passwords
# Explicit exception to "never remove 942100 or 941100 from an API field" (PO decision,
# byul-byul, 2026-11-23, INF-11). No CRS rule inspects the password fields below, on their
# own path and method only; every other field of these requests (email, token) is still
# inspected by every rule, and an SQL injection in the email is still blocked.
# Why: a password manager's password is random symbols. Of 300 random 16-character ones
# using all of string.punctuation, 152 got the WAF's 403 at paranoia level 2 (942131,
# 932240, 942520, 942370, ... and in 5 cases PL1 rules such as 942100); of 300 like
# Bitwarden's default (!@#$%^&*), 79 (932240, 942131). Those users could neither sign up
# nor log in, and each audit line stored the password in clear ("Matched Data ... found
# within ARGS:json.password: <password>"). With this exclusion: 0 of 900 blocked and no
# password in the audit log.
# Safe: the API never puts a password into SQL, HTML, a shell or a path. It only hashes it
# (argon2id) or verifies it against the stored hash; length is capped at 128 (422 above).
# Every request field that carries a password (docs/api/api-contract.md, backend/app/auth/
# schemas.py) is listed here; a new one needs its own block (docs/infra/waf.md).

# POST /api/auth/register {email, password}
SecRule REQUEST_FILENAME "@streq /api/auth/register" \
    "id:10030,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"

# POST /api/auth/login {email, password}
SecRule REQUEST_FILENAME "@streq /api/auth/login" \
    "id:10031,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"

# POST /api/auth/change-password {current_password, new_password}
SecRule REQUEST_FILENAME "@streq /api/auth/change-password" \
    "id:10032,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.current_password,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.new_password"

# POST /api/auth/reset-password {token, new_password}
SecRule REQUEST_FILENAME "@streq /api/auth/reset-password" \
    "id:10033,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.new_password"
