# --------------------------------------------------------------------------- passwords
# Explicit exception to "never remove 942100 or 941100 from an API field" (PO decision,
# byul-byul, 2026-11-23, INF-11). No CRS rule inspects the password fields below, on their
# own path and method only; every other field of these requests is still inspected by every
# rule (the reset token too, unless it has the server's exact format: "tokens" below), and
# an SQL injection in the email is still blocked.
# Why: a password manager's password is random symbols. Of 300 random 16-character ones
# using all of string.punctuation, 152 got the WAF's 403 at paranoia level 2 (942131,
# 932240, 942520, 942370, ... and in 5 cases PL1 rules such as 942100); of 300 like
# Bitwarden's default (!@#$%^&*), 79 (932240, 942131). Those users could neither sign up
# nor log in, and each audit line stored the password in clear ("Matched Data ... found
# within ARGS:json.password: <password>"). With this exclusion: 0 of 900 blocked and no
# password in the audit log.
# Safe: the API never puts a password into SQL, HTML, a shell or a path. It only hashes it
# (argon2id) or verifies it against the stored hash; length is capped at 128 (422 above).
# Every request field that carries a password (docs/api/api-contract.md, backend/app/auth/
# schemas.py) is listed here; a new one needs its own block (docs/infra/waf.md).

# POST /api/auth/register {email, password}
SecRule REQUEST_FILENAME "@streq /api/auth/register" \
    "id:10030,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"

# POST /api/auth/login {email, password}
SecRule REQUEST_FILENAME "@streq /api/auth/login" \
    "id:10031,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"

# POST /api/auth/change-password {current_password, new_password}
SecRule REQUEST_FILENAME "@streq /api/auth/change-password" \
    "id:10032,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.current_password,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.new_password"

# POST /api/auth/reset-password {token, new_password}
SecRule REQUEST_FILENAME "@streq /api/auth/reset-password" \
    "id:10033,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.new_password"

# --------------------------------------------------------------------------- tokens
# Second explicit exception to "never remove 942100 or 941100 from an API field" (PO decision,
# byul-byul, 2026-11-25, INF-11). A token field skips every CRS rule only when its value has
# exactly the format the server generates; any other value keeps every rule, 942100 and
# 941100 included, so "' OR 1=1 --" or a 43-character value with a quote is still blocked.
# Why: the server's random tokens (secrets.token_urlsafe: A-Z a-z 0-9 - _) sometimes look
# like SQL. libinjection (942100, PL1) reads a value matching ^[0-9]+-.*-- as "number minus
# something, then an SQL comment": 1 reset link in about 24,000 and 1 WebSocket ticket or
# OAuth state in about 36,000 was refused, and 942210, 942450, 932236, 942120 (PL2) refused
# more, the signed tokens (JWT) too (docs/infra/waf.md "Token fields"; evidence:
# infra/proxy/waf-sweep.sh tokens, 202,000 values per kind: before these blocks 14 tickets,
# 26 reset tokens, 12 verify JWTs, 12 refresh JWTs and 23 OAuth states got the WAF's 403,
# after them none).
# Safe: only the server's alphabet at the exact length passes the check, and the API never
# puts these values into SQL, HTML, a shell or a path: it looks a ticket up in Redis,
# compares a state with its cookie, hashes a reset token (SHA-256) to look it up, and
# verifies a JWT's signature.
# How each block works, in phase 2 (when the JSON body has been parsed; this file is loaded
# before every CRS rule, so these rules run before the CRS rules of phase 2, where every rule
# that matched a token is): path and method, then exactly one value under that name
# (&ARGS:<name> counts the query and the body together, so a second "ticket" or a duplicate
# JSON key gets no lift), then the value against the regex, and only then the ctl. The ctl
# removes that one target from every rule tagged OWASP_CRS; every other field of the request
# is still inspected.
# Formats (backend/app/auth/security.py, backend/app/realtime/service.py):
#   token_urlsafe(32): 32 random bytes as exactly 43 characters (WS ticket, OAuth state)
#   token_urlsafe(48): 48 random bytes as exactly 64 characters (password reset token)
#   JWT HS256 (create_token): header.payload.signature, base64url; the signature is always
#     43 characters. Longest real ones: an email verify token 273 characters (sub at the
#     BigInteger maximum, 19 digits, and ver at the integer maximum), a refresh token 244;
#     the caps are 290 and 260.
# Each regex ends in \z, not $: in PCRE, $ also matches before a final newline, and a reset
# token followed by "\n" got the lift with $ (INF-11 test); \z is the end of the value.

# GET /ws?ticket=<43>: the chat WebSocket (realtime/routes.py)
SecRule REQUEST_FILENAME "@streq /ws" \
    "id:10050,phase:2,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq GET" "t:none,chain"
        SecRule &ARGS:ticket "@eq 1" "chain"
            SecRule ARGS:ticket "@rx ^[A-Za-z0-9_-]{43}\z" "t:none,\
                ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:ticket"

# GET /ws/game?ticket=<43>&room_id=<id>: the game room's WebSocket (game/routes.py)
SecRule REQUEST_FILENAME "@streq /ws/game" \
    "id:10051,phase:2,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq GET" "t:none,chain"
        SecRule &ARGS:ticket "@eq 1" "chain"
            SecRule ARGS:ticket "@rx ^[A-Za-z0-9_-]{43}\z" "t:none,\
                ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:ticket"

# GET /api/auth/oauth/42/callback?code=...&state=<43>: 42 sends the browser back with our state
SecRule REQUEST_FILENAME "@streq /api/auth/oauth/42/callback" \
    "id:10052,phase:2,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq GET" "t:none,chain"
        SecRule &ARGS:state "@eq 1" "chain"
            SecRule ARGS:state "@rx ^[A-Za-z0-9_-]{43}\z" "t:none,\
                ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:state"

# The same request's cookie oauth42_state=<43> (set by GET /api/auth/oauth/42/login)
SecRule REQUEST_FILENAME "@streq /api/auth/oauth/42/callback" \
    "id:10053,phase:2,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq GET" "t:none,chain"
        SecRule &REQUEST_COOKIES:oauth42_state "@eq 1" "chain"
            SecRule REQUEST_COOKIES:oauth42_state "@rx ^[A-Za-z0-9_-]{43}\z" "t:none,\
                ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:oauth42_state"

# POST /api/auth/reset-password {token: <64>, new_password}
SecRule REQUEST_FILENAME "@streq /api/auth/reset-password" \
    "id:10054,phase:2,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule &ARGS:json.token "@eq 1" "chain"
            SecRule ARGS:json.token "@rx ^[A-Za-z0-9_-]{64}\z" "t:none,\
                ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.token"

# GET /reset-password?token=<64>: the frontend page the email's link opens
SecRule REQUEST_FILENAME "@streq /reset-password" \
    "id:10055,phase:2,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
    SecRule REQUEST_METHOD "@streq GET" "t:none,chain"
        SecRule &ARGS:token "@eq 1" "chain"
            SecRule ARGS:token "@rx ^[A-Za-z0-9_-]{64}\z" "t:none,\
                ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:token"

# GET /api/auth/verify?token=<JWT>: called by the /verify-email page
SecRule REQUEST_FILENAME "@streq /api/auth/verify" \
    "id:10056,phase:2,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,chain"
