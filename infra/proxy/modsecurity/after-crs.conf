# ModSecurity exclusions loaded AFTER the OWASP CRS rules (INF-11).
#
# Mounted read-only over the image's
# /opt/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf (docker-compose.yml), so
# it is read after every CRS rule. This is where a rule is removed or changed for good, at
# startup (SecRuleRemoveById, SecRuleUpdateTargetById), for every request.
#
# Empty on purpose: every exclusion we need is for one path and method only, so it lives in
# before-crs.conf and runs per request. A startup-time removal here would apply to every
# path, including the API, so add one only with a comment that says why no path can be
# named. Never: SecRuleEngine Off, or removing 942100 or 941100. See docs/infra/waf.md.
