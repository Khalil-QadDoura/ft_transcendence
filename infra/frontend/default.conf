# Replaces the nginx image's default site in the frontend container (FE-01 "preview" stage).
# Reached only through the front proxy, which terminates TLS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    # Directory redirects (/assets -> /assets/) send a relative Location. An absolute one
    # would say http://localhost/assets/: this server sees plain HTTP on port 80 behind the
    # proxy, so the browser would leave HTTPS and lose a non-default port.
    absolute_redirect off;

    # Client-side routes (/jobs/42, /login, ...) get index.html; React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output with hashed names: a missing file is a 404, not index.html served as JS.
    location /assets/ {
        try_files $uri =404;
    }
}
