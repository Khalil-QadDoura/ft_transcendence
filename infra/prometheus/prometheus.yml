# Prometheus (INF-08, module M12): what it scrapes inside the Docker network.
# Pull model: Prometheus asks each target for its /metrics every 15 s; no target pushes and
# none is reachable from the host or through the proxy. Retention (30 days, at most 1 GB) is
# set by the command-line flags in docker-compose.yml, not here.
# Alert rules (INF-10): alerts.yml, evaluated every 15 s (evaluation_interval); unit tests in
# alerts.test.yml. No Alertmanager: alerts show in Prometheus and Grafana only.
# Check: `make metrics-check` (infra/prometheus/smoke-test.sh). Details: "M12 — Monitoring"
# in docs/infra/infrastructure.md.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Mounted read-only next to this file (docker-compose.yml, service prometheus).
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus itself: TSDB size, scrape durations, rule evaluation.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI (BE-30, backend/app/core/metrics.py): prometheus-fastapi-instrumentator serves
  # /metrics at the root of the app on port 8000, with no key. Labels are the route
  # template (`handler="/api/users/{user_id}"`), method and status: no raw path, no id.
  # The proxy answers 404 for /metrics and /api/metrics, so only this network reaches it.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # prometheus-community/postgres_exporter: pg_up, connections, database size, locks.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # oliver006/redis_exporter: redis_up, memory, clients, commands, keys.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # cAdvisor: CPU and memory of every container, labelled with its compose service
  # (container_label_com_docker_compose_service="api").
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
