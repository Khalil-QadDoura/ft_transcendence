name: Frontend
on:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'docs/legal/**', '.github/workflows/frontend.yml']
  push:
    branches: [main, 'feat/FE-*']
    paths: ['frontend/**', 'backend/**', 'docs/legal/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run legal:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t wozu-frontend:ci .
  auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wozu_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@127.0.0.1:5432/wozu_auth_test
      WOZU_TEST_BACKEND_URL: http://127.0.0.1:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Test authentication against the actual backend
        shell: bash
        run: |
          python frontend/scripts/serve-auth-test-backend.py > "$RUNNER_TEMP/auth-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8010/api/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/auth-backend.log"
            exit 1
          fi
          cd frontend
          npx vitest run --config scripts/auth-backend.config.ts
