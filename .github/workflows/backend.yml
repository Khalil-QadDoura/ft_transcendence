name: Backend
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main, 'feat/BE-*']
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wozu_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/wozu_ci_test
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/wozu_ci_test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=pytest-results.xml
      - name: Require database tests to run
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('pytest-results.xml').getroot().iter('testsuite')
          skipped = sum(int(suite.get('skipped', '0')) for suite in suites)
          assert skipped == 0, f'{skipped} tests skipped; database validation is incomplete'
          PY
      - run: docker build -t wozu-backend:ci .
